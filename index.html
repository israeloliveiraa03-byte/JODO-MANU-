<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O quarto da Manu</title>
<meta name="theme-color" content="#5d6fd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Luz e sombra usadas por todos os desenhos (o "3D" do jogo) -->
    <radialGradient id="vol" cx=".38" cy=".3" r=".78">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f14" stop-opacity=".24"/>
    </radialGradient>
    <radialGradient id="volSuave" cx=".4" cy=".22" r=".95">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f14" stop-opacity=".16"/>
    </radialGradient>
    <linearGradient id="cil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0f14" stop-opacity=".16"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f14" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="cilDeitado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f14" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="iris" cx=".5" cy=".75" r=".65">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <radialGradient id="sombraChao">
      <stop offset="0" stop-color="#2b2440" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2b2440" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eefa"/>
      <stop offset="1" stop-color="#c2d5ee"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d79a5e"/>
      <stop offset="1" stop-color="#e8b37a"/>
    </linearGradient>
    <radialGradient id="luzJanela">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilhoChama">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<!-- O QUARTO -->
<svg id="palco" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Quarto da Manu com objetos para tocar"></svg>
<div class="balao" id="balao" aria-live="polite"></div>

<button id="voltar" type="button" hidden aria-label="Segure para voltar ao início">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
  <svg class="anel" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/></svg>
</button>

<!-- TELA INICIAL -->
<div id="inicio">
  <div class="inicio-conteudo">
    <div class="pedestal">
      <svg id="retrato" viewBox="-120 -372 240 384" aria-hidden="true"></svg>
    </div>
    <div class="inicio-texto">
      <h1>O quarto da Manu</h1>
      <button id="brincar" type="button" class="botao-brincar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        Brincar
      </button>
      <button id="montar" type="button" class="botao-montar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 5 6l2 3 1-1v3l-4 9h16l-4-9V8l1 1 2-3-4-3c0 2-1.5 3-3 3S9 5 9 3z"/></svg>
        Montar a Manu
      </button>
      <p class="nota">No quarto, segure a casinha no canto por 1 segundo para voltar para cá.</p>
    </div>
  </div>
</div>

<!-- ATELIÊ DE PERSONAGEM -->
<div id="editor" hidden>
  <header class="topo">
    <button id="desistir" type="button" class="botao-icone" aria-label="Voltar sem salvar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h2>Montar a Manu</h2>
    <button id="sortear" type="button" class="botao-icone" aria-label="Sortear um visual">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.4" class="cheio"/><circle cx="15" cy="15" r="1.4" class="cheio"/><circle cx="15" cy="9" r="1.4" class="cheio"/><circle cx="9" cy="15" r="1.4" class="cheio"/></svg>
    </button>
    <button id="pronto" type="button" class="botao-pronto">Pronto</button>
  </header>
  <div id="vitrine" class="vitrine">
    <svg id="previa" viewBox="-120 -372 240 384" aria-label="Como a Manu está ficando" role="img"></svg>
  </div>
  <section class="painel">
    <nav id="abas" class="abas" role="tablist" aria-label="O que mudar"></nav>
    <div id="painel-rolagem" class="painel-rolagem">
      <div id="cores" class="cores"></div>
      <div id="opcoes" class="opcoes"></div>
    </div>
  </section>
</div>

<!-- A ordem importa: cada arquivo usa o que veio antes -->
<script src="js/som.js"></script>
<script src="js/avatar.js"></script>
<script src="js/cena.js"></script>
<script src="js/editor.js"></script>
<script src="js/jogo.js"></script>
</body>
</html>
