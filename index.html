<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O quarto da Manu</title>
<meta name="theme-color" content="#27346a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manu">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: uma cena só, que ocupa a tela inteira; o quarto se reorganiza em pé ou deitado.
   Visual único e deliberado (quarto de criança iluminado), por isso não há tema escuro. */
:root {
  --parede: #cfe0f2;
  --noite: #27346a;
  --amarelo: #f2b630;
  --coral: #f08a7e;
  --menta: #3aa6a0;
  --tinta: #2b2440;
  --fonte: "Baloo 2", "Trebuchet MS", "Verdana", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  overflow: hidden;
  background: #bcd2ea;
  color: var(--tinta);
  font-family: var(--fonte);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#palco { display: block; width: 100%; height: 100%; }

/* ---------- animações dos objetos ---------- */
.anim { transform-box: fill-box; transform-origin: 50% 100%; }
.objeto { cursor: pointer; }
.pula { animation: pula .7s ease-out; }
.balanca { animation: balanca .8s ease-in-out; }
.afunda { animation: afunda .9s ease-in-out; }
.treme { animation: treme .5s ease-in-out; }
.brilha .sol { animation: sol 1s ease-in-out; transform-box: fill-box; transform-origin: center; }

@keyframes pula {
  0% { transform: translateY(0); }
  30% { transform: translateY(-30px) scale(1.03); }
  55% { transform: translateY(0) scale(1.05, .95); }
  75% { transform: translateY(-8px); }
  100% { transform: none; }
}
@keyframes balanca {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-6deg); }
  40% { transform: rotate(6deg); }
  60% { transform: rotate(-4deg); }
  80% { transform: rotate(3deg); }
}
@keyframes afunda {
  0%, 100% { transform: none; }
  40% { transform: scale(1.03, .94); }
}
@keyframes treme {
  0%, 100% { transform: none; }
  25% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
  75% { transform: rotate(-3deg); }
}
@keyframes sol {
  0%, 100% { transform: scale(1) rotate(0); }
  50% { transform: scale(1.35) rotate(40deg); }
}

/* braço da Manu acenando */
.braco { transform-box: fill-box; transform-origin: 50% 6%; }
.acenando .braco { animation: acena 1.6s ease-in-out; }
@keyframes acena {
  0%, 100% { transform: rotate(0); }
  18% { transform: rotate(150deg); }
  34% { transform: rotate(120deg); }
  50% { transform: rotate(155deg); }
  66% { transform: rotate(120deg); }
  82% { transform: rotate(150deg); }
}

/* rabo do gato */
.rabo { transform-box: fill-box; transform-origin: 100% 100%; animation: rabo 2.4s ease-in-out infinite; }
.pula .rabo { animation: rabo .35s ease-in-out 3; }
@keyframes rabo { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }

/* chama da vela */
.chama { transform-box: fill-box; transform-origin: 50% 100%; animation: chama .9s ease-in-out infinite; }
.balanca .chama { animation: chamaGrande .8s ease-in-out; }
@keyframes chama { 0%, 100% { transform: scale(1); } 50% { transform: scale(.88, 1.1); } }
@keyframes chamaGrande { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.7); } }

/* caixa surpresa */
.tampa { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
.aberta .tampa { transform: translate(-38px, -66px) rotate(-28deg); }
.urso { transform: translateY(48px); transition: transform .45s cubic-bezier(.3, 1.7, .5, 1); }
.aberta .urso { transform: translateY(-4px); }

/* noite (ao tocar na cama) */
#ceu { fill: #9fd3f5; transition: fill .8s; }
.noite #ceu { fill: #22305e; }
#escuro { opacity: 0; transition: opacity .8s; pointer-events: none; }
.noite #escuro { opacity: .48; }
.sol, .nuvem { transition: opacity .6s; }
.noite .sol, .noite .nuvem { opacity: 0; }
.lua, .estrela { opacity: 0; transition: opacity .8s; pointer-events: none; }
.noite .lua, .noite .estrela { opacity: 1; }
.noite .estrela { animation: pisca 1.6s ease-in-out infinite; }
@keyframes pisca { 50% { opacity: .5; } }
.zzz text { opacity: 0; }
.noite .zzz text { animation: zzz 2.4s ease-out infinite; }
.noite .zzz text:nth-child(2) { animation-delay: .5s; }
.noite .zzz text:nth-child(3) { animation-delay: 1s; }
@keyframes zzz {
  0% { opacity: 0; transform: translateY(10px); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-30px); }
}

/* ---------- balão de fala (para os adultos acompanharem) ---------- */
.balao {
  position: fixed;
  left: 0; top: 0;
  transform: translate(-50%, -100%) scale(.6);
  opacity: 0;
  pointer-events: none;
  background: #fff;
  color: var(--tinta);
  font: 800 clamp(18px, 4.2vmin, 30px)/1.1 var(--fonte);
  padding: .35em .8em .25em;
  border-radius: 999px;
  border: 4px solid var(--coral);
  box-shadow: 0 6px 0 rgba(43, 36, 64, .15);
  white-space: nowrap;
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), opacity .2s;
  z-index: 5;
}
.balao.pai { border-color: var(--menta); }
.balao.visivel { opacity: 1; transform: translate(-50%, -100%) scale(1); }

/* confete ao tocar */
.confete {
  position: fixed;
  width: 14px; height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
  animation: confete .7s ease-out forwards;
}
@keyframes confete {
  to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
}

/* ---------- tela inicial ---------- */
#inicio {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--noite);
  color: #fff;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.inicio-conteudo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.inicio-conteudo svg { width: auto; height: min(30vh, 220px); }
.inicio-texto { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#inicio h1 {
  margin: 0;
  font: 800 clamp(30px, 7vmin, 52px)/1 var(--fonte);
  color: var(--amarelo);
  text-wrap: balance;
}
#brincar {
  width: clamp(110px, 24vmin, 150px);
  aspect-ratio: 1;
  max-width: 100%;
  border: 0;
  border-radius: 50%;
  background: var(--amarelo);
  color: var(--tinta);
  font: 800 clamp(20px, 4.4vmin, 26px)/1 var(--fonte);
  box-shadow: 0 8px 0 #c98d16;
  display: grid;
  place-items: center;
  gap: 2px;
  cursor: pointer;
  animation: respira 2s ease-in-out infinite;
}
#brincar svg { width: 38%; height: auto; }
#brincar:active { transform: translateY(6px); box-shadow: 0 2px 0 #c98d16; }
#brincar:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
@keyframes respira { 50% { transform: scale(1.06); } }
.nota {
  margin: 0;
  max-width: 34ch;
  font: 600 14px/1.4 var(--fonte);
  color: #c9d3f2;
}
@media (orientation: landscape) {
  .inicio-conteudo { flex-direction: row; gap: 28px; text-align: left; }
  .inicio-conteudo svg { height: min(62vh, 260px); }
  .inicio-texto { align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<svg id="palco" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Quarto da Manu com objetos para tocar"></svg>

<div class="balao" id="balao" aria-live="polite"></div>

<div id="inicio">
  <div class="inicio-conteudo">
    <svg id="retrato" viewBox="-110 -330 220 340" aria-hidden="true"></svg>
    <div class="inicio-texto">
      <h1>O quarto da Manu</h1>
      <button id="brincar" type="button" aria-label="Brincar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#2b2440"/></svg>
        Brincar
      </button>
      <p class="nota">Por enquanto, a voz do celular lê as falas. Quando vocês gravarem as suas, elas entram no lugar.</p>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1. A CENA: o que cada objeto faz e o que ele fala.
   Esta é a parte que vocês vão mexer mais.
   Quando gravarem os áudios, é só trocar "arquivo: null"
   pelo nome do arquivo, por exemplo: arquivo: "audio/oi_manu.mp3"
   ========================================================= */
const CENA = {
  manu:   { acao: "acenar",   falas: [ { texto: "Oi, Manu!",         voz: "mae", arquivo: null },
                                       { texto: "Te amo!",           voz: "pai", arquivo: null } ] },
  gato:   { acao: "pular",    falas: [ { texto: "Miau!",             voz: "pai", arquivo: null } ] },
  bolo:   { acao: "balancar", falas: [ { texto: "Hum, que gostoso!", voz: "mae", arquivo: null },
                                       { texto: "Ebaaa!",            voz: "pai", arquivo: null } ] },
  cama:   { acao: "dormir",   falas: [ { texto: "Boa noite...",      voz: "pai", arquivo: null } ] },
  caixa:  { acao: "surpresa", sequencia: true,
                              falas: [ { texto: "Cadê?",             voz: "mae", arquivo: null },
                                       { texto: "Achou!",            voz: "mae", arquivo: null } ] },
  janela: { acao: "brilhar",  falas: [ { texto: "Uau!",              voz: "mae", arquivo: null },
                                       { texto: "Que legal!",        voz: "pai", arquivo: null } ] },
};

/* =========================================================
   2. ONDE cada coisa fica: uma arrumação para o celular
   deitado e outra para o celular em pé.
   ========================================================= */
const ARRUMACAO = {
  deitado: {
    tamanho: [1000, 600], chao: 440,
    janela: { x: 640, y: 70 }, quadro: { x: 330, y: 120 }, varal: { x1: 30, x2: 970, y: 34 },
    tapete: { x: 520, y: 548, rx: 230, ry: 40 },
    estrelasTeto: [[90, 120], [210, 80], [480, 110], [560, 200], [900, 120], [950, 250]],
    cama:  { x: 220, y: 525, s: 1.1 },
    manu:  { x: 460, y: 560, s: 1 },
    gato:  { x: 615, y: 582, s: .95 },
    bolo:  { x: 775, y: 532, s: 1 },
    caixa: { x: 918, y: 568, s: .85 },
  },
  empe: {
    tamanho: [600, 1000], chao: 640,
    janela: { x: 330, y: 150 }, quadro: { x: 50, y: 250 }, varal: { x1: 16, x2: 584, y: 60 },
    tapete: { x: 300, y: 905, rx: 250, ry: 52 },
    estrelasTeto: [[70, 150], [200, 110], [260, 220], [560, 120], [570, 420], [220, 400]],
    cama:  { x: 165, y: 720, s: .9 },
    caixa: { x: 475, y: 712, s: .85 },
    manu:  { x: 330, y: 930, s: 1.1 },
    gato:  { x: 95,  y: 978, s: .9 },
    bolo:  { x: 500, y: 962, s: .9 },
  },
};

/* =========================================================
   3. OS DESENHOS. Cada objeto é desenhado com o ponto (0,0)
   no "pé" dele, para ficar fácil de colocar no chão.
   ========================================================= */
const PELE = "#9a6444", PELE_ESCURA = "#7e4f34", CABELO = "#1c1410";
const VESTIDO = "#f2b630", VESTIDO_ESCURO = "#d4930f";

function puff(cx, cy) {
  const bolinhas = [[-24, -10], [-18, -26], [0, -32], [18, -26], [26, -8], [22, 12], [0, 18], [-20, 12]];
  return `<circle cx="${cx}" cy="${cy}" r="30" fill="${CABELO}"/>` +
    bolinhas.map(([dx, dy]) => `<circle cx="${cx + dx}" cy="${cy + dy}" r="12" fill="${CABELO}"/>`).join("");
}
function borboleta(x, y, giro) {
  return `<g transform="translate(${x} ${y}) rotate(${giro})">
    <path d="M0 0 L-14 -9 L-12 8 Z" fill="#dfe3ec" stroke="#aab2c4" stroke-width="1.5"/>
    <path d="M0 0 L14 -9 L12 8 Z" fill="#eef0f5" stroke="#aab2c4" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#aab2c4"/></g>`;
}

const DESENHO = {
  manu() {
    const furinhos = [[-30, -118], [0, -122], [30, -118], [-45, -95], [-15, -98], [15, -98], [45, -95],
                      [-24, -160], [24, -160], [0, -150]]
      .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="${VESTIDO_ESCURO}"/>`).join("");
    return `
      <rect x="-95" y="-325" width="190" height="325" fill="#fff" fill-opacity="0"/>
      ${puff(-50, -282)}${puff(50, -282)}
      <rect x="-24" y="-78" width="16" height="70" rx="8" fill="${PELE}"/>
      <rect x="8" y="-78" width="16" height="70" rx="8" fill="${PELE}"/>
      <ellipse cx="-18" cy="-6" rx="14" ry="7" fill="${PELE}"/>
      <ellipse cx="18" cy="-6" rx="14" ry="7" fill="${PELE}"/>
      <rect x="-60" y="-178" width="15" height="82" rx="7.5" fill="${PELE}" transform="rotate(10 -52 -178)"/>
      <g class="braco"><rect x="45" y="-178" width="15" height="82" rx="7.5" fill="${PELE}" transform="rotate(-10 52 -178)"/></g>
      <path d="M-38 -184 Q0 -192 38 -184 L82 -70 Q0 -50 -82 -70 Z" fill="${VESTIDO}"/>
      <path d="M-46 -140 Q0 -132 46 -140" stroke="${VESTIDO_ESCURO}" stroke-width="3" fill="none"/>
      <path d="M-76 -84 Q0 -66 76 -84" stroke="${VESTIDO_ESCURO}" stroke-width="3" fill="none"/>
      ${furinhos}
      <ellipse cx="-42" cy="-182" rx="20" ry="11" fill="#f7c54e"/>
      <ellipse cx="42" cy="-182" rx="20" ry="11" fill="#f7c54e"/>
      <rect x="-9" y="-202" width="18" height="22" fill="${PELE}"/>
      <circle cx="-46" cy="-232" r="10" fill="${PELE}"/>
      <circle cx="46" cy="-232" r="10" fill="${PELE}"/>
      <circle cx="0" cy="-235" r="46" fill="${PELE}"/>
      <path d="M-46 -238 Q-46 -290 0 -289 Q46 -290 46 -238 Q40 -266 0 -268 Q-40 -266 -46 -238 Z" fill="${CABELO}"/>
      ${borboleta(-42, -306, -15)}${borboleta(56, -308, 12)}
      <ellipse cx="-16" cy="-236" rx="6.5" ry="8" fill="#1a110c"/>
      <ellipse cx="16" cy="-236" rx="6.5" ry="8" fill="#1a110c"/>
      <circle cx="-14" cy="-239" r="2.2" fill="#fff"/>
      <circle cx="18" cy="-239" r="2.2" fill="#fff"/>
      <circle cx="-29" cy="-219" r="7" fill="#d07a62" fill-opacity=".35"/>
      <circle cx="29" cy="-219" r="7" fill="#d07a62" fill-opacity=".35"/>
      <path d="M-4 -224 Q0 -220 4 -224" stroke="${PELE_ESCURA}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-11 -212 Q0 -202 11 -212" stroke="#5a2a1e" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  },

  gato() {
    const LARANJA = "#e8954a", LISTRA = "#c9732f";
    return `
      <rect x="-100" y="-150" width="180" height="150" fill="#fff" fill-opacity="0"/>
      <g class="rabo"><path d="M-52 -42 Q-98 -52 -86 -104" stroke="${LARANJA}" stroke-width="15" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="-6" cy="-42" rx="56" ry="38" fill="${LARANJA}"/>
      <path d="M-30 -76 q4 14 0 26 M-12 -79 q4 14 0 28" stroke="${LISTRA}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="8" cy="-30" rx="28" ry="20" fill="#f7d2a8"/>
      <ellipse cx="-42" cy="-8" rx="15" ry="9" fill="${LARANJA}"/>
      <ellipse cx="22" cy="-7" rx="13" ry="8" fill="${LARANJA}"/>
      <ellipse cx="46" cy="-7" rx="13" ry="8" fill="${LARANJA}"/>
      <path d="M14 -110 L18 -144 L40 -120 Z" fill="${LARANJA}"/>
      <path d="M44 -120 L64 -144 L66 -108 Z" fill="${LARANJA}"/>
      <path d="M21 -117 L23 -134 L34 -121 Z" fill="#f4a6b8"/>
      <path d="M50 -120 L60 -133 L61 -114 Z" fill="#f4a6b8"/>
      <circle cx="40" cy="-92" r="33" fill="${LARANJA}"/>
      <path d="M34 -124 q2 10 0 16 M46 -124 q-2 10 0 16" stroke="${LISTRA}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="28" cy="-95" rx="4.5" ry="6.5" fill="#2a1a12"/>
      <ellipse cx="52" cy="-95" rx="4.5" ry="6.5" fill="#2a1a12"/>
      <circle cx="29.5" cy="-97" r="1.6" fill="#fff"/>
      <circle cx="53.5" cy="-97" r="1.6" fill="#fff"/>
      <path d="M36 -84 L44 -84 L40 -79 Z" fill="#e0707f"/>
      <path d="M33 -75 Q40 -70 40 -78 Q40 -70 47 -75" stroke="#7a3b22" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M20 -82 L-2 -86 M20 -78 L-2 -76 M60 -82 L82 -86 M60 -78 L82 -76" stroke="#7a3b22" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
  },

  bolo() {
    const granulado = [[-30, -150, "#7aa7e0"], [-8, -140, "#8fc9a9"], [16, -152, "#f2b630"], [36, -138, "#7aa7e0"], [-40, -135, "#f2b630"]]
      .map(([x, y, c]) => `<rect x="${x}" y="${y}" width="9" height="4" rx="2" fill="${c}" transform="rotate(${x % 50} ${x} ${y})"/>`).join("");
    let cobertura = "M-52 -176 Q-52 -192 -36 -192 L36 -192 Q52 -192 52 -176";
    for (let i = 0; i < 6; i++) cobertura += " q-8.67 13 -17.33 0";
    return `
      <rect x="-95" y="-245" width="190" height="245" fill="#fff" fill-opacity="0"/>
      <rect x="-72" y="-112" width="12" height="112" rx="5" fill="#a6643a"/>
      <rect x="60" y="-112" width="12" height="112" rx="5" fill="#a6643a"/>
      <rect x="-88" y="-124" width="176" height="18" rx="7" fill="#b9774a"/>
      <ellipse cx="0" cy="-125" rx="68" ry="10" fill="#f7f7f2"/>
      <rect x="-52" y="-186" width="104" height="62" rx="10" fill="#f4a6b8"/>
      <rect x="-52" y="-160" width="104" height="8" fill="#e98aa2"/>
      <path d="${cobertura} Z" fill="#fff8f2"/>
      ${granulado}
      <rect x="-4" y="-220" width="8" height="30" rx="2" fill="#8fc9a9"/>
      <path d="M-4 -212 L4 -216 M-4 -202 L4 -206" stroke="#fff" stroke-width="2"/>
      <g class="chama"><ellipse cx="0" cy="-230" rx="7" ry="11" fill="#ffb52e"/><ellipse cx="0" cy="-227" rx="3.5" ry="6" fill="#fff2a8"/></g>`;
  },

  cama() {
    const bolinhas = [[-20, -84], [10, -74], [40, -86], [70, -72], [96, -84], [-30, -66], [56, -62]]
      .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#79b594"/>`).join("");
    return `
      <rect x="-155" y="-200" width="310" height="200" fill="#fff" fill-opacity="0"/>
      <rect x="-130" y="-30" width="14" height="30" rx="4" fill="#8d5531"/>
      <rect x="118" y="-30" width="14" height="30" rx="4" fill="#8d5531"/>
      <rect x="-150" y="-172" width="42" height="172" rx="16" fill="#a6643a"/>
      <circle cx="-129" cy="-140" r="9" fill="#f2b630"/>
      <rect x="-140" y="-64" width="280" height="38" rx="10" fill="#b9774a"/>
      <rect x="120" y="-112" width="28" height="112" rx="11" fill="#a6643a"/>
      <rect x="-112" y="-90" width="232" height="30" rx="12" fill="#fbfbf8"/>
      <ellipse cx="-78" cy="-98" rx="32" ry="16" fill="#ffffff" stroke="#e2e2dc" stroke-width="2"/>
      <rect x="-46" y="-102" width="166" height="48" rx="14" fill="#8fc9a9"/>
      <path d="M-46 -88 Q-30 -96 -14 -90" stroke="#ffffff" stroke-width="3" fill="none" stroke-opacity=".7"/>
      ${bolinhas}
      <g class="zzz" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#ffffff">
        <text x="-66" y="-130" font-size="26">z</text>
        <text x="-44" y="-158" font-size="32">z</text>
        <text x="-16" y="-188" font-size="40">Z</text>
      </g>`;
  },

  caixa() {
    const URSO = "#b07a4f", URSO_CLARO = "#e3b98f";
    return `
      <rect x="-80" y="-205" width="160" height="205" fill="#fff" fill-opacity="0"/>
      <g class="urso">
        <circle cx="-21" cy="-134" r="11" fill="${URSO}"/><circle cx="21" cy="-134" r="11" fill="${URSO}"/>
        <circle cx="-21" cy="-134" r="5" fill="${URSO_CLARO}"/><circle cx="21" cy="-134" r="5" fill="${URSO_CLARO}"/>
        <circle cx="0" cy="-110" r="29" fill="${URSO}"/>
        <ellipse cx="0" cy="-101" rx="13" ry="10" fill="${URSO_CLARO}"/>
        <ellipse cx="0" cy="-105" rx="4.5" ry="3.2" fill="#3a2418"/>
        <path d="M-5 -97 Q0 -92 5 -97" stroke="#3a2418" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="-10" cy="-117" r="3.5" fill="#2a1a12"/><circle cx="10" cy="-117" r="3.5" fill="#2a1a12"/>
      </g>
      <rect x="-56" y="-100" width="112" height="100" rx="7" fill="#3aa6a0"/>
      <circle cx="-34" cy="-70" r="5" fill="#64c2bb"/><circle cx="34" cy="-30" r="5" fill="#64c2bb"/>
      <circle cx="-30" cy="-22" r="5" fill="#64c2bb"/><circle cx="32" cy="-76" r="5" fill="#64c2bb"/>
      <rect x="-9" y="-100" width="18" height="100" fill="#f2b630"/>
      <g class="tampa">
        <rect x="-63" y="-124" width="126" height="28" rx="7" fill="#2f8f8a"/>
        <rect x="-9" y="-124" width="18" height="28" fill="#e0a21f"/>
        <ellipse cx="-17" cy="-133" rx="17" ry="10" fill="#f2b630" stroke="#e0a21f" stroke-width="3"/>
        <ellipse cx="17" cy="-133" rx="17" ry="10" fill="#f2b630" stroke="#e0a21f" stroke-width="3"/>
        <circle cx="0" cy="-131" r="7" fill="#e0a21f"/>
      </g>`;
  },
};

function estrela(cx, cy, r, classe) {
  let pts = "";
  for (let i = 0; i < 10; i++) {
    const raio = i % 2 ? r * .45 : r;
    const ang = Math.PI / 5 * i - Math.PI / 2;
    pts += `${(cx + raio * Math.cos(ang)).toFixed(1)},${(cy + raio * Math.sin(ang)).toFixed(1)} `;
  }
  return `<polygon class="${classe}" points="${pts}" fill="#fff2a8"/>`;
}

function fundo(a) {
  const [L, A] = a.tamanho, c = a.chao;
  let s = `<rect x="0" y="0" width="${L}" height="${c}" fill="#cfe0f2"/>`;
  for (let x = 30; x < L; x += 70) s += `<rect x="${x}" y="0" width="30" height="${c}" fill="#c4d8ee"/>`;
  s += `<rect x="0" y="${c}" width="${L}" height="${A - c}" fill="#d9a066"/>`;
  for (let y = c + 38; y < A; y += 44) s += `<line x1="0" y1="${y}" x2="${L}" y2="${y}" stroke="#c98d55" stroke-width="3"/>`;
  s += `<rect x="0" y="${c - 14}" width="${L}" height="16" fill="#f4f1ec"/>`;

  // varal de bandeirinhas
  const v = a.varal, meio = (v.x1 + v.x2) / 2, curva = v.y + 50, cores = ["#f2b630", "#f08a7e", "#8fc9a9", "#7aa7e0"];
  s += `<path d="M${v.x1} ${v.y} Q${meio} ${curva} ${v.x2} ${v.y}" stroke="#8a6a55" stroke-width="2.5" fill="none"/>`;
  const n = Math.round((v.x2 - v.x1) / 60);
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n;
    const x = (1 - t) ** 2 * v.x1 + 2 * (1 - t) * t * meio + t * t * v.x2;
    const y = (1 - t) ** 2 * v.y + 2 * (1 - t) * t * curva + t * t * v.y;
    s += `<path d="M${x - 15} ${y} L${x + 15} ${y} L${x} ${y + 28} Z" fill="${cores[i % 4]}"/>`;
  }

  // quadrinho desenhado
  const q = a.quadro;
  s += `<g transform="translate(${q.x} ${q.y})">
    <rect x="0" y="0" width="110" height="90" rx="6" fill="#fffdf8" stroke="#b9774a" stroke-width="8"/>
    <path d="M55 70 C20 46 30 22 47 28 C52 30 55 36 55 36 C55 36 58 30 63 28 C80 22 90 46 55 70 Z" fill="#f08a7e"/>
    <circle cx="24" cy="24" r="9" fill="#f2b630"/></g>`;

  // tapete
  const t = a.tapete;
  s += `<ellipse cx="${t.x}" cy="${t.y}" rx="${t.rx}" ry="${t.ry}" fill="#f08a7e"/>
        <ellipse cx="${t.x}" cy="${t.y}" rx="${t.rx - 18}" ry="${t.ry - 10}" fill="none" stroke="#f7b8ae" stroke-width="4" stroke-dasharray="10 9"/>`;
  return s;
}

function janela(p) {
  return `<g class="objeto" data-id="janela" transform="translate(${p.x} ${p.y})"><g class="anim">
    <rect x="-8" y="-8" width="236" height="200" fill="#fff" fill-opacity="0"/>
    <rect x="0" y="0" width="220" height="170" rx="12" fill="#ffffff"/>
    <rect id="ceu" x="12" y="12" width="196" height="146" rx="6"/>
    <circle class="sol" cx="162" cy="50" r="24" fill="#ffd23f"/>
    <g class="nuvem" fill="#ffffff"><ellipse cx="58" cy="118" rx="30" ry="14"/><ellipse cx="78" cy="108" rx="22" ry="14"/><ellipse cx="44" cy="108" rx="16" ry="11"/></g>
    <g class="lua"><circle cx="160" cy="52" r="22" fill="#f6f0c8"/><circle cx="171" cy="45" r="19" fill="#22305e"/></g>
    ${estrela(48, 44, 7, "estrela")}${estrela(86, 92, 5, "estrela")}${estrela(130, 120, 6, "estrela")}
    <rect x="107" y="12" width="6" height="146" fill="#ffffff"/>
    <rect x="12" y="82" width="196" height="6" fill="#ffffff"/>
    <rect x="-12" y="164" width="244" height="14" rx="6" fill="#f4f1ec"/>
  </g></g>`;
}

/* =========================================================
   4. MONTAR A CENA na tela
   ========================================================= */
const palco = document.getElementById("palco");
const balao = document.getElementById("balao");
const OBJETOS = ["cama", "caixa", "bolo", "gato", "manu"];
let arrumacaoAtual = null;

function montar() {
  const nome = palco.clientHeight > palco.clientWidth ? "empe" : "deitado";
  if (nome === arrumacaoAtual) return;
  arrumacaoAtual = nome;
  const a = ARRUMACAO[nome];
  const [L, A] = a.tamanho;
  palco.setAttribute("viewBox", `0 0 ${L} ${A}`);

  // quem está mais embaixo na tela é desenhado por último (fica na frente)
  const ordem = [...OBJETOS].sort((x, y) => a[x].y - a[y].y);
  const objetos = ordem.map(id => {
    const p = a[id];
    return `<g class="objeto" data-id="${id}" transform="translate(${p.x} ${p.y}) scale(${p.s})"><g class="anim">${DESENHO[id]()}</g></g>`;
  }).join("");

  palco.innerHTML = fundo(a) + janela(a.janela) + objetos +
    `<rect id="escuro" x="0" y="0" width="${L}" height="${A}" fill="#0e1840"/>` +
    a.estrelasTeto.map(([x, y]) => estrela(x, y, 10, "estrela")).join("");
}

/* =========================================================
   5. SONS: voz do celular agora, gravações de vocês depois
   ========================================================= */
let audioCtx = null, audioAtual = null, vozesPt = [];

function carregarVozes() {
  if (!("speechSynthesis" in window)) return;
  vozesPt = speechSynthesis.getVoices().filter(v => (v.lang || "").toLowerCase().startsWith("pt"));
}
if ("speechSynthesis" in window) {
  carregarVozes();
  speechSynthesis.onvoiceschanged = carregarVozes;
}

function falarTexto(texto, voz) {
  return new Promise(pronto => {
    let feito = false;
    const fim = () => { if (!feito) { feito = true; pronto(); } };
    if (!("speechSynthesis" in window)) { sininho(); setTimeout(fim, 700); return; }
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "pt-BR";
    const br = vozesPt.find(v => v.lang.replace("_", "-").toLowerCase() === "pt-br") || vozesPt[0];
    if (br) u.voice = br;
    u.pitch = voz === "pai" ? .7 : 1.4;   // voz grossa para o pai, fina para a mãe
    u.rate = .9;
    u.onend = fim;
    u.onerror = fim;
    setTimeout(fim, 900 + texto.length * 130); // segurança, caso o celular não avise que terminou
    speechSynthesis.speak(u);
  });
}

function tocarArquivo(caminho) {
  return new Promise(pronto => {
    audioAtual = new Audio(caminho);
    audioAtual.onended = pronto;
    audioAtual.onerror = pronto;
    audioAtual.play().catch(pronto);
  });
}

function falar(fala) {
  return fala.arquivo ? tocarArquivo(fala.arquivo) : falarTexto(fala.texto, fala.voz);
}

function pararSons() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (audioAtual) { audioAtual.pause(); audioAtual = null; }
}

function nota(freq, inicio, dur, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + inicio;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 2, t + .09);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + .02);
}
const pop = () => nota(420, 0, .18, .2);
const sininho = () => { nota(660, 0, .3, .15); nota(990, .12, .4, .12); };

/* =========================================================
   6. O QUE ACONTECE quando ela toca em algo
   ========================================================= */
let rodada = 0;          // cada toque novo "vence" o anterior
const vez = {};          // qual fala cada objeto diz da próxima vez
const esperar = ms => new Promise(r => setTimeout(r, ms));

function reiniciar(el, ...classes) {
  el.classList.remove(...classes);
  void el.getBoundingClientRect(); // força o navegador a "esquecer" a animação anterior
  el.classList.add(...classes);
}

function fecharCaixa() {
  const c = palco.querySelector('[data-id="caixa"] .anim');
  if (c) c.classList.remove("aberta");
}

let timerBalao;
function mostrarBalao(id, fala) {
  const alvo = palco.querySelector(`[data-id="${id}"]`);
  if (!alvo) return;
  const r = alvo.getBoundingClientRect();
  balao.textContent = fala.texto;
  balao.classList.toggle("pai", fala.voz === "pai");
  const meia = Math.min(140, innerWidth / 2 - 10);
  balao.style.left = Math.max(meia, Math.min(innerWidth - meia, r.left + r.width / 2)) + "px";
  balao.style.top = Math.max(70, r.top + 10) + "px";
  balao.classList.remove("visivel");
  void balao.offsetWidth;
  balao.classList.add("visivel");
  clearTimeout(timerBalao);
  timerBalao = setTimeout(() => balao.classList.remove("visivel"), 2000);
}

function confete(x, y) {
  const cores = ["#f2b630", "#f08a7e", "#8fc9a9", "#7aa7e0", "#ffffff"];
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.className = "confete";
    const ang = Math.PI * 2 * i / 9 + Math.random() * .4, dist = 50 + Math.random() * 40;
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.style.background = cores[i % cores.length];
    d.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    d.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 750);
  }
}

async function tocar(id) {
  const minhaRodada = ++rodada;
  pararSons();
  const obj = CENA[id];
  const el = palco.querySelector(`[data-id="${id}"] .anim`);
  if (id !== "cama") palco.classList.remove("noite");
  if (id !== "caixa") fecharCaixa();

  if (obj.acao === "acenar") reiniciar(el, "pula", "acenando");
  if (obj.acao === "pular") reiniciar(el, "pula");
  if (obj.acao === "balancar") reiniciar(el, "balanca");
  if (obj.acao === "brilhar") reiniciar(el, "brilha");
  if (obj.acao === "dormir") { reiniciar(el, "afunda"); palco.classList.add("noite"); }
  if (obj.acao === "surpresa") { el.classList.remove("aberta"); reiniciar(el, "treme"); }

  if (obj.sequencia) {
    // a caixa fala "Cadê?", abre a tampa e fala "Achou!"
    for (let i = 0; i < obj.falas.length; i++) {
      if (minhaRodada !== rodada) return;
      if (i > 0) el.classList.add("aberta");
      mostrarBalao(id, obj.falas[i]);
      await falar(obj.falas[i]);
      if (i === 0) await esperar(250);
    }
    await esperar(2500);
    if (minhaRodada === rodada) fecharCaixa();
    return;
  }

  // os outros objetos alternam entre as falas que têm
  const n = vez[id] || 0;
  vez[id] = n + 1;
  const fala = obj.falas[n % obj.falas.length];
  mostrarBalao(id, fala);
  await falar(fala);
  if (obj.acao === "dormir") {
    await esperar(1500);
    if (minhaRodada === rodada) palco.classList.remove("noite");
  }
}

palco.addEventListener("pointerdown", e => {
  e.preventDefault();
  confete(e.clientX, e.clientY);
  pop();
  const alvo = e.target.closest(".objeto");
  if (alvo) tocar(alvo.dataset.id);
});
palco.addEventListener("contextmenu", e => e.preventDefault());

/* =========================================================
   7. TELA INICIAL: o primeiro toque libera o som
   (os celulares só deixam tocar som depois de um toque)
   ========================================================= */
document.getElementById("retrato").innerHTML = DESENHO.manu();

document.getElementById("brincar").addEventListener("click", async () => {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e) {}
  try { await document.documentElement.requestFullscreen?.(); } catch (e) {}
  try { await navigator.wakeLock?.request("screen"); } catch (e) {}
  document.getElementById("inicio").hidden = true;
  arrumacaoAtual = null;
  montar();
  sininho();
  falarTexto("Vamos brincar!", "mae");
});

document.addEventListener("visibilitychange", () => { if (document.hidden) pararSons(); });
addEventListener("resize", montar);
montar();
</script>
